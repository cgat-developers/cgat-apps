name: cgat-apps

on: [push, pull_request]

jobs:
  build:
    name: Ex1 (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.12", "3.13", "3.14"]

    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      - name: Cache conda
        uses: actions/cache@v4
        env:
          # Increase this value to reset cache if conda/environments/cgat-apps.yml has not changed
          CACHE_NUMBER: 0
        with:
          path: ~/conda_pkgs_dir
          key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ hashFiles('conda/environments/cgat-apps.yml') }}

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          activate-environment: cgat-a
          environment-file: conda/environments/cgat-apps.yml
          channels: conda-forge,bioconda
          channel-priority: strict
          auto-update-conda: false

      - name: Show conda
        run: |
          conda info
          conda list

      - name: Test
        run: |
          pip install -e .
          pip install pytest
          pytest -v tests/test_style.py
          pytest -v tests/test_scripts.py
          pytest -v tests/test_import.py
          pytest -v tests/AlignmentCoordinates_test.py tests/GTF_test.py tests/Intervals_test.py tests/Tree_test.py tests/Masker_test.py tests/ncl_test.py tests/cnestedlist_test.py
