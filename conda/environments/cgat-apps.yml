# cgat-apps development and CI environment
# Python 3.10+ required (see pyproject.toml)
#
# Packages without reliable conda builds for Python 3.13+
# (pybedtools, pyBigWig, quicksect) are installed via pip.

name: cgat-a

channels:
- conda-forge
- bioconda

dependencies:
- python
- biopython
- cython>=0.29.35
- cgatcore
- matplotlib
- pytest
- numpy
- pandas
- pep8
- pysam
- pyyaml
- rdflib
- scikit-learn
- scipy
- setuptools>=64
- sortedcontainers
- bedtools
- grep
- htslib
- samtools
- tar
- ucsc-bedgraphtobigwig
- ucsc-wigtobigwig
- wget
- pip
- pip:
  - pybedtools
  - pyBigWig
  - quicksect
