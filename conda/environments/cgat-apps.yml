# cgat-apps development and CI environment
# Python 3.10+ required (see pyproject.toml)

name: cgat-a

channels:
- conda-forge
- bioconda

dependencies:
- python
- biopython
- cython>=0.29.35
- cgatcore
- matplotlib
- pytest
- numpy
- pandas
- pep8
- pybedtools
- pybigwig
- pysam
- pyyaml
- quicksect
- rdflib
- scikit-learn
- scipy
- setuptools>=64
- sortedcontainers
- bedtools
- grep
- htslib
- samtools
- tar
- ucsc-bedgraphtobigwig
- ucsc-wigtobigwig
- wget
- zlib
